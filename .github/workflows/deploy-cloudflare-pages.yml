name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy (Pages)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages output
        run: npm run pages:build

      - name: Create Pages project (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages project create mayanschool --production-branch main \
            || echo "Pages project already exists"

      - name: Use Pages wrangler config
        shell: bash
        run: cp wrangler.pages.jsonc wrangler.jsonc

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-dist --project-name mayanschool --branch main

      - name: Sync Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1" value="${2:-}"
            if [ -z "$value" ]; then
              echo "Skipping $name (not configured)"
              return
            fi
            printf '%s' "$value" | npx wrangler pages secret put "$name" --project-name mayanschool
          }
          sync_secret TURSO_DATABASE_URL "$TURSO_DATABASE_URL"
          sync_secret TURSO_AUTH_TOKEN "$TURSO_AUTH_TOKEN"
          sync_secret ADMIN_PASSWORD "$ADMIN_PASSWORD"
          sync_secret ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"
