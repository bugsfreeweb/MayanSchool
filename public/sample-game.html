<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mayan School — গুনে দেখি</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1fb;color:#34313b;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:#fff;padding:36px;text-align:center;border-radius:24px;width:min(100%,540px);border:1px solid #e9e3f1}h1{font-size:28px;margin:8px 0 12px}p{color:#737079;line-height:1.8}#flowers{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0}.flower{font-size:42px}#answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{cursor:pointer;min-height:58px;border:2px solid #e9e2f3;border-radius:13px;background:#faf8fe;font-size:23px;color:#7353aa}button:hover{background:#ede5f8;border-color:#a88acb}button:disabled{cursor:default}.right{background:#e2efdf!important;border-color:#85ad78!important}.wrong{background:#ffebe4!important}#feedback{min-height:52px;font-size:17px;color:#5b824e}#next{background:#7653ae;color:white;border:none;padding:0 25px;font-size:17px}small{color:#8b779f}</style></head><body><main><small>MAYAN SCHOOL · শেখার ছোট্ট খেলা</small><h1>ফুল গুনে দেখি!</h1><p id="prompt">এখানে কয়টি ফুল আছে? সঠিক সংখ্যায় চাপ দাও।</p><div id="flowers" aria-label="গোনার জন্য ফুল"></div><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>পরের প্রশ্ন →</button></main><script>const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);let round=0,score=0,correct=0;const flowers=document.getElementById('flowers'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function play(){correct=2+Math.floor(Math.random()*6);flowers.innerHTML=Array.from({length:correct},()=>'<span class="flower">🌼</span>').join('');feedback.textContent='';next.hidden=true;let options=[correct];while(options.length<4){const n=1+Math.floor(Math.random()*9);if(!options.includes(n))options.push(n)}options.sort(()=>Math.random()-.5);answers.replaceChildren();options.forEach(n=>{const button=document.createElement('button');button.textContent=bn(n);button.setAttribute('aria-label',bn(n)+'টি ফুল');button.onclick=()=>{Array.from(answers.children).forEach(b=>b.disabled=true);if(n===correct){score++;button.className='right';feedback.textContent='দারুণ! একদম ঠিক হয়েছে।'}else{button.className='wrong';feedback.textContent='ভালো চেষ্টা! একসাথে গুনি—মোট '+bn(correct)+'টি ফুল।'}round++;next.hidden=false;next.textContent=round>=5?'ফলাফল দেখি →':'পরের প্রশ্ন →'};answers.appendChild(button)})}next.onclick=()=>{if(round>=5){flowers.innerHTML='<span class="flower">⭐</span>';answers.replaceChildren();document.querySelector('h1').textContent='তুমি দারুণ করেছ!';document.getElementById('prompt').textContent='৫টির মধ্যে '+bn(score)+'টি সঠিক হয়েছে।';feedback.textContent='প্রতিটি চেষ্টাই নতুন শেখা।';next.textContent='আবার খেলি';next.onclick=()=>location.reload()}else play()};play();</script></body></html>
